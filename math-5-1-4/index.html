<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브롤스튜던츠 - 학습 게임</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<!-- ============= 시작 화면 ============= -->
<div id="startScreen" class="screen active">
  <div class="title-wrap">
    <h1 class="game-title">브롤스튜던츠</h1>
    <p class="subtitle"><span id="packTitle">분수 덧셈</span> 챌린지</p>
  </div>

  <!-- 게임 모드 선택 -->
  <div class="mode-section">
    <p class="section-label">게임 모드</p>
    <div class="mode-grid" id="modeGrid"></div>
  </div>

  <!-- 캐릭터 선택 -->
  <div class="character-section">
    <p class="section-label">브롤러 선택</p>
    <div class="player-turn-indicator" id="charTurnIndicator"></div>
    <div class="character-grid" id="characterGrid"></div>
  </div>

  <!-- 난이도 선택 -->
  <div class="difficulty-section">
    <p class="section-label">난이도</p>
    <div class="difficulty-grid" id="difficultyGrid"></div>
  </div>

  <button class="start-btn" id="startBtn" disabled>배틀 시작!</button>
</div>

<!-- ============= 모험 모드 ============= -->
<div id="adventureScreen" class="screen">
  <div class="game-header">
    <div class="player-info">
      <div class="player-avatar" id="playerAvatar">😎</div>
      <div>
        <div class="player-name-display" id="playerNameDisplay">브롤러</div>
        <div class="player-level">🎮 <span id="stageInfo">스테이지 1/5</span></div>
      </div>
    </div>
    <div class="header-stats">
      <div class="header-stat combo">
        <div class="label">🔥 콤보</div>
        <div class="value" id="advCombo">0</div>
      </div>
      <div class="header-stat timer" id="advQuestionTimerStat">
        <div class="label">⏱ 시간</div>
        <div class="value" id="advQuestionTimer">15.0</div>
      </div>
      <div class="header-stat score">
        <div class="label">⭐ 점수</div>
        <div class="value" id="scoreValue">0</div>
      </div>
    </div>
  </div>

  <div class="progress-bar" id="progressBar"></div>

  <div class="hp-section">
    <div class="hp-label">
      <span>❤️ 내 체력</span>
      <span id="hpText">100 / 100</span>
    </div>
    <div class="hp-bar-wrap">
      <div class="hp-bar" id="playerHpBar" style="width: 100%;"></div>
    </div>
  </div>

  <div class="enemy-arena">
    <div class="enemy-label">⚡ 적 등장!</div>
    <div class="enemy-character" id="enemyChar">👾</div>
    <div class="enemy-name" id="enemyName">보스</div>
    <div class="enemy-hp-wrap">
      <div class="enemy-hp-bar" id="enemyHpBar" style="width: 100%;"></div>
    </div>
    <div id="damageContainer"></div>
  </div>

  <div class="question-card">
    <span class="question-number" id="questionNum">문제 1</span>
    <span class="question-topic" id="questionTopic">주제</span>
    <div class="question-text" id="questionText">문제가 여기 표시됩니다</div>
  </div>

  <div class="answer-section">
    <p class="answer-label">✏️ 답을 입력하세요</p>
    <div class="answer-input-wrap" id="answerInputWrap">
      <input type="text" class="answer-input" id="answerInput" placeholder="답" autocomplete="off">
    </div>
  </div>

  <div class="feedback" id="feedback">정답을 입력하고 공격하세요! 💥</div>

  <div class="action-buttons">
    <button class="action-btn hint-btn" id="hintBtn">💡 힌트</button>
    <button class="action-btn attack-btn" id="attackBtn">⚔️ 공격!</button>
  </div>

  <div style="text-align:center; margin-top: 16px;">
    <button class="quit-btn" id="quitBtn">🚪 메인으로</button>
  </div>
</div>

<!-- ============= 결과 화면 ============= -->
<div id="resultScreen" class="screen">
  <div class="result-screen">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <h1 class="result-title" id="resultTitle">승리!</h1>
    <p class="result-subtitle" id="resultSubtitle">진정한 챔피언!</p>

    <div class="stat-card">
      <div class="stat-label">⏱ 총 시간</div>
      <div class="stat-value" id="finalTime">00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⭐ 점수</div>
      <div class="stat-value" id="finalScore">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔥 최고 콤보</div>
      <div class="stat-value" id="finalMaxCombo">0</div>
    </div>

    <button class="start-btn" id="restartBtn" style="margin-top: 30px;">다시 도전!</button>
  </div>
</div>

<div class="turn-overlay" id="turnOverlay">
  <div class="turn-overlay-content">
    <div class="turn-overlay-emoji" id="turnEmoji">🦸‍♀️</div>
    <div class="turn-overlay-title" id="turnTitle">PLAYER 1</div>
    <div class="turn-overlay-subtitle" id="turnSubtitle">차례입니다!</div>
  </div>
</div>

<div class="combo-display" id="comboDisplay"></div>

</div>
